version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fluxen-server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: sqlite:///./data/fluxen.db
      CLIENT_URL: http://localhost:80,http://localhost:5173
      JWT_SECRET: supersecretproductionkey123456789
    ports:
      - "5000:5000"
    volumes:
      - server_data:/app/data

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: fluxen-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  server_data:
